<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 900px;
        height: 500px;
        display: grid;
        place-items: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }
      .card {
        border: 4px solid #6f3ff5;
        border-radius: 18px;
        padding: 48px 64px;
        color: #211a32;
      }
      h1 {
        margin: 0 0 28px;
        color: #6f3ff5;
        font-size: 44px;
      }
      p {
        margin: 0;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>AI Test Agent Vision Test</h1>
      <p>Startzeit: 09:00 &nbsp; Endezeit: 10:00</p>
    </section>
  </body>
</html>
